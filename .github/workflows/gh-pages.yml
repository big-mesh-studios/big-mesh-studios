name: Deploy both sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest corepack
        run: npm install corepack@latest -g

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build both applications
        run: pnpm build

      # One repository publishes one Pages site. The two applications take a
      # folder each under it and the addresses each was built for say so, and
      # the front page takes the root above them.
      - name: Gather the front page and both builds into one site
        run: |
          mkdir -p site/rm-stacker site/voxelscape
          cp -r apps/homepage/dist/. site/
          cp -r apps/rm-stacker/dist/. site/rm-stacker/
          cp -r apps/voxelscape/dist/. site/voxelscape/

      # Every address other than the site root is a page the editor draws, not
      # a file on disk. GitHub Pages serves `404.html` for anything it cannot
      # find, so handing it the application means a page opened directly,
      # reloaded, or followed from a link arrives at the application, which then
      # reads the address and shows the right page.
      - name: Answer unknown addresses with the editor
        run: cp site/rm-stacker/index.html site/rm-stacker/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

name: Deploy the site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest corepack
        run: npm install corepack@latest -g

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build the applications
        run: pnpm build
        env:
          # Read by apps/voxelscape/vite.config.ts, and from there carried to
          # the router and anything else that builds an address of its own —
          # see the `base` comment there.
          VOXELSCAPE_BASE_PATH: /big-mesh-studios/voxelscape/

      # One repository publishes one Pages site. The applications take a folder
      # each under it and the addresses each was built for say so, and the front
      # page takes the root above them. The place documentation takes a folder
      # beside them, and is two prerendered pages rather than an application —
      # nothing is sent to a browser to run it.
      - name: Gather the front page, the builds, and the docs into one site
        run: |
          mkdir -p site/rm-stacker site/voxel-rigger site/voxelscape site/spacescape site/sdf-modeller site/docs
          cp -r apps/homepage/dist/. site/
          cp -r apps/rm-stacker/dist/. site/rm-stacker/
          cp -r apps/voxel-rigger/dist/. site/voxel-rigger/
          cp -r apps/voxelscape/dist/. site/voxelscape/
          cp -r apps/spacescape/dist/. site/spacescape/
          cp -r apps/sdf-modeller/dist/. site/sdf-modeller/
          cp -r apps/place-docs/dist/. site/docs/

      # Every address other than the site root is a page an editor draws, not a
      # file on disk. GitHub Pages serves `404.html` for anything it cannot
      # find, so handing it the application means a page opened directly,
      # reloaded, or followed from a link arrives at the application, which then
      # reads the address and shows the right page. The rigger needs no such
      # copy either: it is one page with no addresses of its own. Voxelscape
      # needs none because its own addresses live after a `#`, which a browser
      # never sends to the server at all, so GitHub Pages never has to answer
      # for one.
      - name: Answer unknown addresses with the editor
        run: |
          cp site/rm-stacker/index.html site/rm-stacker/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

name: Check codebase for type-errors and auto-format

on:
  push:
    branches-ignore: ["wip", "**/wip"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: install latest corepack
        run: npm install corepack@latest -g

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check types
        run: pnpm check-types

      # The place reference is read out of the world's own declarations and
      # committed, so a signature that has drifted from the source it was read
      # from is a reference that is quietly wrong. This is the check that says so
      # rather than leaving it to be noticed.
      - name: Check the place reference is drawn from the current sources
        run: pnpm --filter @big-mesh-studios/bms-voxelscape place-reference:check

      - name: Check formatting
        if: github.event_name == 'pull_request'
        run: pnpm format:check

      - name: Format
        if: github.event_name == 'push'
        run: pnpm format

      - name: Commit formatting changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Format code with prettier"
            git push origin HEAD:${{ github.ref_name }}
          fi

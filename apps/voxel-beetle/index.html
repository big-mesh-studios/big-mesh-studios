<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The viewport is not locked against the reader's own pinch and zoom:
         the canvases below set `touch-action: none` on themselves, which is what
         stops a gesture on one from also zooming the page. `viewport-fit=cover`
         is what makes the display's safe area report a size at all, so the
         toolbar can keep clear of a notch and a home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181a1f" />
    <title>voxel-beetle</title>
  </head>
  <body>
    <div
      id="root"
      style="
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      "
    />
    <script src="./src/index.tsx" type="module"></script>
  </body>
</html>

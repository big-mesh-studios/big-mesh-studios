name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest corepack
        run: npm install corepack@latest -g

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build

      # Every address other than the site root is a page this application draws,
      # not a file on disk. GitHub Pages serves `404.html` for anything it
      # cannot find, so handing it the application means a page opened directly,
      # reloaded, or followed from a link arrives at the application, which then
      # reads the address and shows the right page.
      - name: Answer unknown addresses with the application
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Adjust if your build output directory is different
          publish_branch: gh-pages # Specify the branch to deploy to

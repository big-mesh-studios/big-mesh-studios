packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: true
  esbuild: true

ignoredBuiltDependencies:
  - "@kmamal/gpu"

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - "@random-mesh/rm-pan-scale@0.0.4 || 0.0.5"
  - "@random-mesh/rmsl@1.1.3 || 1.2.1 || 1.2.2 || 1.4.0 || 1.6.0 || 1.6.1 || 1.6.3 || 1.9.0"
  - "@solidjs/signals@2.0.0-beta.29"
  - "@solidjs/web@2.0.0-beta.29"
  - solid-js@2.0.0-beta.29

# Development wiring: the apps consume the local rmsl checkout instead of the
# published package. Drop this key once the target features ship in a release.
overrides:
  "@random-mesh/rmsl": link:../rmsl

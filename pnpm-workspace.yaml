packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: true
  esbuild: true

ignoredBuiltDependencies:
  - "@kmamal/gpu"

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - "@random-mesh/rm-pan-scale@0.0.4 || 0.0.5"
  - "@random-mesh/rmsl@1.1.3 || 1.2.1 || 1.2.2 || 1.4.0 || 1.6.0 || 1.6.1 || 1.6.3 || 1.9.0 || 1.10.0"
  - "@solidjs/signals@2.0.0-beta.29"
  - "@solidjs/web@2.0.0-beta.29"
  - solid-js@2.0.0-beta.29

# Every package asks for "@random-mesh/rmsl": "*", so the version they all
# share is decided here. A package that meets a second copy of it does not
# type-check: one class from two copies is two classes, each with its own
# declarations of the private fields the other one lacks.
overrides:
  "@random-mesh/rmsl": "^1.10.0"
  # Swap the line above for this one to build the apps against the local rmsl
  # checkout instead of the published package.
  # "@random-mesh/rmsl": link:../rmsl
